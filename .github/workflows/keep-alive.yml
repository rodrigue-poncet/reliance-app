name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # Tous les 5 jours à 8h UTC
  workflow_dispatch:        # Permet déclenchement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PROD (reliance-bc-bos)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://xjlcyzfrdjzyznkljzej.supabase.co/rest/v1/ \
            -H "apikey: ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            && echo " ✅ PROD OK"

      - name: Ping TEST (reliance-app)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://zjsgzspvrtliypckixkf.supabase.co/rest/v1/ \
            -H "apikey: ${{ secrets.SUPABASE_TEST_ANON_KEY }}" \
            && echo " ✅ TEST OK"
