name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PROD (reliance-bc-bos)
        run: |
          CODE=$(curl -s -o /tmp/prod.json -w "%{http_code}" \
            "https://xjlcyzfrdjzyznkljzej.supabase.co/rest/v1/consultants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_ANON_KEY }}")
          cat /tmp/prod.json
          echo "HTTP $CODE"
          if [ "$CODE" -ge 300 ]; then echo "❌ PROD FAILED"; exit 1; fi
          echo "✅ PROD OK"
      - name: Ping TEST (reliance-app)
        run: |
          CODE=$(curl -s -o /tmp/test.json -w "%{http_code}" \
            "https://zjsgzspvrtliypckixkf.supabase.co/rest/v1/consultants?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_TEST_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_TEST_ANON_KEY }}")
          cat /tmp/test.json
          echo "HTTP $CODE"
          if [ "$CODE" -ge 300 ]; then echo "❌ TEST FAILED"; exit 1; fi
          echo "✅ TEST OK"
